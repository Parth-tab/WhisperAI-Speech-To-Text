name: PR Validation & CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Static Code Analysis (Ruff)
        run: ruff check src/ tests/

      - name: Type Checking (Mypy)
        run: mypy src/

      - name: Run Full Test Suite with Coverage
        run: pytest tests/ --cov=src --cov-report=term-missing

      - name: Cache LLM Models
        uses: actions/cache@v3
        with:
          path: ~/.whisperai/models
          key: ${{ runner.os }}-whisperai-models-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-whisperai-models-

      - name: Deterministic ML Profiling Step
        run: pytest tests/profiling_test.py -v -s

      - name: Production Bundle Compilation
        run: pyinstaller WhisperAI.spec --clean --noconfirm
