name: Release Automation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Build Executable
        run: pyinstaller WhisperAI.spec --clean --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/setup.iss
          if (Test-Path "installer/Output/WhisperAISetup.exe") {
            Copy-Item "installer/Output/WhisperAISetup.exe" "WhisperAISetup.exe" -Force
          }

      - name: Generate Checksums
        run: |
          certutil -hashfile dist/WhisperAI.exe SHA256 > dist/checksums.txt
          if (Test-Path "installer/Output/WhisperAISetup.exe") {
            certutil -hashfile installer/Output/WhisperAISetup.exe SHA256 >> dist/checksums.txt
          }

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/WhisperAI.exe
            installer/Output/WhisperAISetup.exe
            WhisperAISetup.exe
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
